<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Incan · Three new wordmark directions</title>
  <style>
    :root { color-scheme: dark; background: #211c17; color: #f5eddd; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: auto; padding: 28px 20px 48px; }
    h1 { font-size: clamp(22px, 3vw, 32px); margin: 0 0 8px; font-weight: 600; }
    p { color: #cfc3af; line-height: 1.5; margin: 0; }
    nav { display: flex; gap: 12px; margin: 18px 0 28px; flex-wrap: wrap; }
    a { color: #f4ce83; text-underline-offset: 4px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid #786245; border-radius: 4px; text-decoration: none; }
    a:focus-visible { outline: 2px solid #6ed7fa; outline-offset: 4px; }
    figure { margin: 0 0 32px; scroll-margin-top: 20px; }
    figcaption { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
    h2 { margin: 0; font-size: 19px; font-weight: 600; }
    figcaption a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
    figure > a { display: block; }
    img { width: 100%; height: auto; display: block; }
    footer { border-top: 1px solid #594a37; padding-top: 18px; font-size: 13px; color: #cfc3af; }
    @media (max-width: 600px) { main { padding: 22px 12px 32px; } figcaption { padding: 0 4px; } }
  </style>
</head>
<body><main><h1>Three new Incan directions</h1><p>Each direction beside the same original tesseract. Tap a pairing to zoom, or open its wordmark alone.</p><nav aria-label="Jump to a direction"><a href="#option-1">Option 1</a><a href="#option-2">Option 2</a><a href="#option-3">Option 3</a></nav><figure id="option-1"><figcaption><h2>Option 1</h2><a href="option-1.png">Open full pairing ↗</a></figcaption><a href="option-1.png" aria-label="Open option 1 beside the original tesseract"><img src="option-1.png" width="2300" height="750" alt="Option 1: a new Incan wordmark beside the unchanged original gold and cyan tesseract."></a><p style="margin-top:12px"><a href="wordmark-1.png">Open wordmark alone ↗</a></p></figure>
<figure id="option-2"><figcaption><h2>Option 2</h2><a href="option-2.png">Open full pairing ↗</a></figcaption><a href="option-2.png" aria-label="Open option 2 beside the original tesseract"><img src="option-2.png" width="2300" height="750" alt="Option 2: a new Incan wordmark beside the unchanged original gold and cyan tesseract."></a><p style="margin-top:12px"><a href="wordmark-2.png">Open wordmark alone ↗</a></p></figure>
<figure id="option-3"><figcaption><h2>Option 3</h2><a href="option-3.png">Open full pairing ↗</a></figcaption><a href="option-3.png" aria-label="Open option 3 beside the original tesseract"><img src="option-3.png" width="2300" height="750" alt="Option 3: a new Incan wordmark beside the unchanged original gold and cyan tesseract."></a><p style="margin-top:12px"><a href="wordmark-3.png">Open wordmark alone ↗</a></p></figure><footer>Design exploration · <a href="../wordmark-studies-2026-10-22/">Earlier studies</a></footer></main></body></html>
