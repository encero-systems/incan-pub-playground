<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Incan wordmark studies · October 22</title>
  <style>
    :root { color-scheme: dark; background: #211c17; color: #f5eddd; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: auto; padding: 28px 20px 48px; }
    h1 { font-size: clamp(22px, 3vw, 32px); margin: 0 0 8px; font-weight: 600; }
    p { color: #cfc3af; line-height: 1.5; margin: 0; }
    nav { display: flex; gap: 12px; margin: 18px 0 28px; flex-wrap: wrap; }
    a { color: #f4ce83; text-underline-offset: 4px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid #786245; border-radius: 4px; text-decoration: none; }
    a:focus-visible { outline: 2px solid #6ed7fa; outline-offset: 4px; }
    figure { margin: 0 0 32px; scroll-margin-top: 20px; }
    figcaption { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
    h2 { margin: 0; font-size: 19px; font-weight: 600; }
    figcaption a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
    figure > a { display: block; }
    img { width: 100%; height: auto; display: block; }
    footer { border-top: 1px solid #594a37; padding-top: 18px; font-size: 13px; color: #cfc3af; }
    @media (max-width: 600px) { main { padding: 22px 12px 32px; } figcaption { padding: 0 4px; } }
  </style>
</head>
<body>
  <main>
    <h1>Incan wordmark studies</h1>
    <p>Selected wordmark with the original tesseract, followed by the earlier studies. Tap an image to open it at full resolution and zoom.</p>
    <nav aria-label="Jump to a study"><a href="#lockups">Selected logo layouts</a><a href="#refinement">Refinement · 1 + 2</a><a href="#option-1">Option 1</a><a href="#option-2">Option 2</a><a href="#option-3">Option 3</a></nav>
    <section id="lockups" aria-label="Selected wordmark with the original tesseract">
      <figure id="horizontal">
        <figcaption><h2>Side by side</h2><a href="lockup-horizontal.png">Open full image ↗</a></figcaption>
        <a href="lockup-horizontal.png" aria-label="Open the horizontal logo layout at full resolution"><img src="lockup-horizontal.png" alt="Original cyan and gold Incan tesseract beside the selected gold architectural INCAN wordmark." width="2622" height="724"></a>
      </figure>
      <figure id="stacked">
        <figcaption><h2>Stacked</h2><a href="lockup-stacked.png">Open full image ↗</a></figcaption>
        <a href="lockup-stacked.png" aria-label="Open the stacked logo layout at full resolution"><img src="lockup-stacked.png" alt="Original cyan and gold Incan tesseract centered above the selected gold architectural INCAN wordmark." width="2172" height="1674"></a>
      </figure>
    </section>
    <figure id="refinement">
      <figcaption><h2>Refinement · 1 + 2</h2><a href="clean-distressed-blend.png">Open full image ↗</a></figcaption>
      <a href="clean-distressed-blend.png" aria-label="Open the combined refinement at full resolution"><img src="clean-distressed-blend.png" alt="Incan wordmark refinement combining the clean planes of option 1 with a restrained touch of option 2's distressed gold leaf and a bright blue-white spark." width="2171" height="724"></a>
    </figure>
    <figure id="option-1">
      <figcaption><h2>Option 1</h2><a href="option-1.png">Open full image ↗</a></figcaption>
      <a href="option-1.png" aria-label="Open option 1 at full resolution"><img src="option-1.png" alt="Option 1: Incan gold wordmark with smooth satin faces and a bright blue spark in the first N." width="2171" height="724"></a>
    </figure>
    <figure id="option-2">
      <figcaption><h2>Option 2</h2><a href="option-2.png">Open full image ↗</a></figcaption>
      <a href="option-2.png" aria-label="Open option 2 at full resolution"><img src="option-2.png" alt="Option 2: Incan gold wordmark with a more tactile gilded surface and a bright blue spark in the first N." width="2171" height="724"></a>
    </figure>
    <figure id="option-3">
      <figcaption><h2>Option 3</h2><a href="option-3.png">Open full image ↗</a></figcaption>
      <a href="option-3.png" aria-label="Open option 3 at full resolution"><img src="option-3.png" alt="Option 3: Incan gold wordmark with broad burnished reflections and a bright blue spark in the first N." width="2171" height="724"></a>
    </figure>
    <footer>Design studies · October 22, 2026 · <a href="../../">Back to the playground</a></footer>
  </main>
</body>
</html>
