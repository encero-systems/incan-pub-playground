const calendar=s=>new Date(s.slice(0,10)+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
function drawPopularity(p,c,source){const upstream=source==='upstream',stats=upstream?c.popularity:c.registry,days=stats.daily,period=calendar(days[0].date)+'–'+calendar(days.at(-1).date),title=upstream?'Upstream popularity':'Incan.pub downloads';
 document.getElementById('view-popularity').innerHTML=`<section class="surface popularity-section"><div class="popularity-sources" role="group" aria-label="Download source"><button id="downloads-registry" aria-pressed="${!upstream}">Incan.pub</button><button id="downloads-upstream" aria-pressed="${upstream}">crates.io upstream</button></div><div class="section-heading"><div><h2>${title}</h2><p>${upstream?'Downloads from crates.io, across all versions.':'Registry downloads reported by GitHub Packages, across all versions and build tags.'}</p></div><span class="data-source">${upstream?'crates.io':'GHCR'}</span></div><div class="metric-grid">${upstream?`<div><strong>${count(stats.periodTotal)}</strong><span>Last ${stats.completeDays} complete days</span></div><div><strong>${count(stats.allTime)}</strong><span>All-time upstream downloads</span></div><div><strong>${count(stats.selectedVersion)}</strong><span>Version ${esc(p.version)} · all time</span></div>`:`<div><strong>${count(stats.total)}</strong><span>Total registry downloads</span></div><div><strong>${count(stats.periodTotal)}</strong><span>Last 30 days · includes today</span></div><div><strong>${count(days.at(-1).downloads)}</strong><span>Today so far · partial day</span></div>`}</div><figure class="download-figure"><picture><source media="(max-width:1100px)" srcset="assets/${upstream?'downloads-':'registry-downloads-'}${esc(p.name)}-mobile.png"><img src="assets/${upstream?'downloads-':'registry-downloads-'}${esc(p.name)}.png" alt="Daily ${upstream?'crates.io':'GitHub Packages'} downloads for ${esc(p.name)}, ${esc(period)}; ${stats.periodTotal.toLocaleString('en-US')} downloads in this window." loading="lazy"></picture><figcaption>${esc(period)} · ${upstream?'complete UTC days':'GitHub reporting dates; today is partial'}</figcaption></figure><p class="metric-note">${upstream?'Upstream usage is context for an adopted package; it does not measure Incan.pub downloads or unique users.':'Registry downloads are not a count of unique users or project installs. CI and verification pulls can contribute; one package can have several build artifacts.'}</p><details class="download-data"><summary>Daily download data</summary><table class="details-table"><thead><tr><th>Date ${upstream?'(UTC)':'(GitHub)'}</th><th>Downloads</th></tr></thead><tbody>${days.map(d=>`<tr><th>${esc(d.date)}</th><td>${d.downloads.toLocaleString('en-US')}</td></tr>`).join('')}</tbody></table></details><div class="source-links">${link(stats.source,upstream?'Download data source':'View on GitHub Packages')}<span>Snapshot ${calendar(stats.capturedAt)} · ${new Date(stats.capturedAt).toISOString().slice(11,16)} UTC</span></div></section>`;
 document.getElementById('downloads-registry').addEventListener('click',()=>drawPopularity(p,c,'registry'));document.getElementById('downloads-upstream').addEventListener('click',()=>drawPopularity(p,c,'upstream'))}
async function hydrateContext(p){try{const c=(await packageContext())[p.name];if(current!==p||!c)return;
 const popularity=c.popularity,days=popularity.daily,period=days.length?calendar(days[0].date)+'–'+calendar(days.at(-1).date):'No daily history';
 document.getElementById('package-attribution').innerHTML=`<span class="creator-credit">${c.authors.length?'By '+c.authors.map(esc).join(' · '):'Author attribution not recorded'}</span><span class="package-namespace">crates-io/${esc(p.name)}</span>`;
 document.getElementById('package-activity').innerHTML=`<span><strong>${count(c.registry.total)}</strong> Incan.pub registry downloads <span class="metric-period">/ all time · ${calendar(c.registry.capturedAt)} snapshot</span></span><button data-view="popularity">View trend</button>`;
 document.getElementById('package-activity').querySelector('button').addEventListener('click',()=>showView('popularity'));
 drawPopularity(p,c,'registry');
 const selected=c.history.find(h=>h.version===p.version);
 document.getElementById('view-releases').innerHTML=`<section class="surface releases-section"><h2>Release notes</h2><div class="release-current"><div class="release-title"><code>${esc(p.version)}</code><span>Selected version</span></div><div class="release-dates"><span>Released on crates.io <strong>${calendar(c.upstreamReleased)}</strong></span><span>Adopted into Incan.pub <strong>${calendar(c.adoptedAt)}</strong></span></div>${selected?.notes?`<ul class="release-excerpt">${selected.notes.replace(/^-\s*/," ").trim().split(/\s+-\s+/).map(note=>`<li>${esc(note)}</li>`).join("")}</ul>`:'<p class="metric-note">Release notes for this version are not available in this preview.</p>'}<div class="source-links">${selected?.notesUrl?link(selected.notesUrl,'Read full release notes'):''}${link('https://crates.io/crates/'+p.name+'/'+p.version,'View upstream release')}</div></div><h3>Recent upstream releases</h3><p class="metric-note">Availability refers to the pinned Incan.pub index. Upstream releases may be newer or unavailable here.</p><div class="release-history">${c.history.map(h=>`<article class="release-row ${h.version===p.version?'selected-release':''}"><div><strong>${esc(h.version)}</strong><span>${calendar(h.released)}</span></div><div class="release-availability">${h.version===p.version?'Selected':h.indexed?'In Incan.pub':'Upstream only'}</div><div>${link(h.notesUrl||h.upstreamUrl,h.notesUrl?'Release notes':'crates.io')}</div></article>`).join('')}</div></section>`;
 document.getElementById('context-provenance').innerHTML=`<section class="surface"><h2>People and sources</h2><table class="details-table"><tr><th>Declared upstream authors</th><td>${c.authors.map(esc).join(' · ')||'Not recorded'}</td></tr><tr><th>Published upstream by</th><td>${c.publishedBy?.url?link(c.publishedBy.url,c.publishedBy.name||c.publishedBy.login):'Not recorded'}</td></tr><tr><th>Adopted into Incan.pub by</th><td>${esc(c.adoptedBy||'Not recorded')}</td></tr></table><div class="source-links">${link(c.authorsSource,'Published source archive with author metadata')}${link('https://crates.io/crates/'+p.name+'/'+p.version,'crates.io version')}${p.about.repository?link(p.about.repository,'GitHub source'):''}</div></section>`;
 }catch(e){if(current!==p)return;for(const id of ['package-attribution','package-activity','view-releases','view-popularity']){const el=document.getElementById(id);if(el)el.textContent='Additional package information could not be loaded. Upstream links remain available.'}}}
function packagePage(p){current=p;view='overview';document.title=p.name+' · incan.pub — design preview';app.innerHTML=`<div class="breadcrumb"><a href="#browse">Browse</a><span>/</span>crates-io<span>/</span>${esc(p.name)}</div><div class="package-heading"><div class="identity"><h1>${esc(p.name)}</h1><span class="type">Adopted · crates.io</span></div><div class="release-meta"><span class="release-select">${esc(p.version)}</span><a class="license" href="#" id="license-link">${esc(p.about.license||'License not recorded')}</a></div></div><p class="description">${esc(p.about.description)}</p><div class="byline" id="package-attribution"><span>Loading author attribution…</span></div><div class="package-links">${link("https://crates.io/crates/"+p.name+"/"+p.version,"crates.io")}${p.about.repository?link(p.about.repository,"GitHub source"):""}${p.about.documentation?link(p.about.documentation,"Docs"):""}</div><div class="page-tabs" role="tablist" aria-label="Package sections">${['overview','builds','releases','popularity','provenance'].map(v=>`<button class="page-tab" role="tab" id="nav-${v}" aria-controls="view-${v}" aria-selected="${v==='overview'}" tabindex="${v==='overview'?0:-1}" data-view="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div id="view-overview" class="tab-panel" role="tabpanel" aria-labelledby="nav-overview"><section class="install"><h2 class="section-label">Add to loaf.toml</h2><p class="install-note">Declare this Loaf in your project.</p><div class="command"><code id="command">${toml(dependency(p))}</code><button class="copy" id="copy-dependency">Copy</button></div></section><div class="package-activity" id="package-activity" aria-live="polite">Loading download context…</div><div class="overview-grid"><section class="surface"><h2>About this Loaf</h2><p>${esc(p.about.description)}</p><p>Adopted from crates.io for use with Oven. The index records source identity, declared features, dependencies and compiled assets.</p></section><section class="surface"><h2>Available builds</h2>${platforms(p)}<div class="build-bottom"><span>${p.assets.length} indexed unit${p.assets.length===1?'':'s'} total</span><button data-view="builds">Inspect builds</button></div></section></div>${featureSection(p)}</div><div id="view-builds" class="tab-panel" role="tabpanel" aria-labelledby="nav-builds" hidden></div><div id="view-releases" class="tab-panel" role="tabpanel" aria-labelledby="nav-releases" hidden><p>Loading release history…</p></div><div id="view-popularity" class="tab-panel" role="tabpanel" aria-labelledby="nav-popularity" hidden><p>Loading download context…</p></div><div id="view-provenance" class="tab-panel" role="tabpanel" aria-labelledby="nav-provenance" hidden><section class="surface"><h2>Publication provenance</h2><p>The Git index records package identity; GitHub Packages holds the bytes.</p><table class="details-table"><tr><th>License</th><td>${esc(p.about.license)}</td></tr><tr><th>Source Loaf digest</th><td><code>${esc(p.archive)}</code></td></tr><tr><th>Upstream checksum</th><td><code>${esc(p.checksum)}</code></td></tr><tr><th>Index snapshot</th><td><code>${esc(p.pin)}</code></td></tr></table><div class="source-links">${link(url(p,'events/'+p.event),'Adoption event')}${link(url(p,'crates-io/'+p.name+'/'+p.version+'/assets.json'),'Asset manifest')}</div></section><div id="context-provenance"></div></div><details class="disclosure" id="registry-details"><summary>License, dependencies and package manifest</summary><div><section class="detail-section"><h2>License</h2><p>${esc(p.about.license)}</p>${link(url(p,'events/'+p.event),'View recorded license metadata')}</section><section class="detail-section"><h2>Declared dependencies</h2>${Object.keys(p.deps).length?Object.entries(p.deps).map(([name,d])=>`<div class="feature-row"><code>${esc(name)}</code><span>${packages.some(x=>'crates-io/'+x.name===d.loaf)?`<a href="#package/${esc(d.loaf.split('/')[1])}">${esc(d.loaf)}</a>`:esc(d.loaf)} · ${esc(d.version)}${d.optional?' · optional':''}</span></div>`).join(''):'<p>No dependencies declared in this manifest.</p>'}</section><section class="detail-section"><h2>Package manifest</h2><div class="code-panel"><pre>${toml(p.manifest)}</pre></div></section></div></details>${footer()}`;drawBuilds(p);wire(p);void hydrateContext(p)}
function showView(v){view=v;document.querySelectorAll('.page-tab').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.view===v));b.tabIndex=b.dataset.view===v?0:-1});document.querySelectorAll('.tab-panel').forEach(x=>x.hidden=x.id!=='view-'+v)}
function drawBuilds(p){const container=document.getElementById('view-builds');if(!p.assets.length){container.innerHTML='<section class="surface"><h2>Compiled assets</h2><p>No compiled assets recorded in this snapshot.</p></section>';return}const targets=[...new Set(p.assets.map(a=>a.binding.target))];container.innerHTML=`<section class="surface"><h2>Compiled assets</h2><p>Inspect an exact indexed binding, including its features and profile.</p><div class="build-controls"><label>Target<select id="target" class="release-select">${targets.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Binding<select id="binding" class="release-select"></select></label></div><div id="unit-summary"></div></section>`;const t=document.getElementById('target'),b=document.getElementById('binding');function summary(){const a=p.assets[Number(b.value)];document.getElementById('unit-summary').innerHTML=`<p><strong>${esc(a.binding.profile)}</strong> · ${esc(a.binding.features.join(', ')||'No features')}</p><p class="evidence-note">${esc(a.binding.toolchain)}</p>${a.attestation?link(a.attestation,'View recorded attestation'):''}<details class="unit-details"><summary>Unit identity and registry location</summary><pre>${esc(a.unit_identity)}\n${esc(a.archive)}\n${esc(a.location.registry+'/'+a.location.repository+':'+a.location.tag)}</pre></details>`}function options(){b.innerHTML=p.assets.map((a,i)=>({a,i})).filter(x=>x.a.binding.target===t.value).map(({a,i})=>`<option value="${i}">${esc(a.binding.profile)} · ${esc(a.binding.features.join(', ')||'no features')}</option>`).join('');summary()}t.addEventListener('change',options);b.addEventListener('change',summary);options();container.updateOptions=options}
function wire(p){document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));document.querySelectorAll('[data-platform]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showView('builds');document.getElementById('target').value=a.dataset.platform;document.getElementById('view-builds').updateOptions()}));document.getElementById('license-link').addEventListener('click',e=>{e.preventDefault();const d=document.getElementById('registry-details');d.open=true;d.scrollIntoView({behavior:'smooth'})});document.getElementById('copy-dependency').addEventListener('click',async e=>{try{await navigator.clipboard.writeText(dependency(p));e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy',1800)}catch{e.target.textContent='Select text to copy'}});document.querySelectorAll('.page-tab').forEach((b,i)=>b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('.page-tab')];const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;showView(tabs[n].dataset.view);tabs[n].focus()}}))}

let catalogState={q:'',origin:'All origins',category:'All categories',license:'All licenses',page:0};let catalogCollapsed=false;
function browse(){renderReader(null)}
function listRows(selected){const filtered=packages.filter(p=>catalogState.origin!=='Incan native'&&(catalogState.category==='All categories'||p.category===catalogState.category)&&(catalogState.license==='All licenses'||(p.about.license||'').split(/\s+(?:OR|AND|WITH)\s+|[()]/).map(x=>x.trim()).includes(catalogState.license))&&[p.name,p.about.description,p.category].join(' ').toLowerCase().includes(catalogState.q.toLowerCase()));document.getElementById('reader-rows').innerHTML=filtered.length?filtered.slice(catalogState.page*50,catalogState.page*50+50).map(p=>`<a class="reader-row ${selected===p.name?'selected':''}" href="#package/${p.name}" ${selected===p.name?'aria-current="true"':''}><div class="reader-row-top"><strong>${esc(p.name)}</strong><code>${esc(p.version)}</code></div><p>${esc(p.about.description)}</p><span class="row-origin">Adopted · crates.io · ${esc(p.about.license)}</span></a>`).join(''):'<div class="reader-empty">No matching packages in this preview. Native publications are not present in the selected snapshot.</div>';document.getElementById('reader-rows').scrollTop=0;document.getElementById('reader-count').textContent=`${filtered.length} matching packages`;document.getElementById('reader-pagination').innerHTML=filtered.length>50?`<button id="page-prev" ${catalogState.page===0?'disabled':''}>Previous</button><span>Page ${catalogState.page+1} of ${Math.ceil(filtered.length/50)}</span><button id="page-next" ${(catalogState.page+1)*50>=filtered.length?'disabled':''}>Next</button>`:'';document.getElementById('page-prev')?.addEventListener('click',()=>{catalogState.page--;listRows(selected)});document.getElementById('page-next')?.addEventListener('click',()=>{catalogState.page++;listRows(selected)})}
function renderReader(p){const selected=p||packages[0];packagePage(selected);const content=document.createElement('div');while(app.firstChild)content.append(app.firstChild);app.innerHTML=`<header class="reader-intro"><h1>Package catalog</h1><p>Explore adopted Loaves, inspect available builds, and add a package to your project.</p></header><div class="reader-shell"><button class="catalog-toggle" id="catalog-toggle" aria-controls="catalog-panel" aria-expanded="true" aria-label="Hide catalog" title="Hide catalog"><img src="assets/arrow-right.svg" alt=""></button><section id="catalog-panel" class="reader-list" aria-label="Package catalog"><div class="reader-tools"><input id="reader-search" aria-label="Filter packages" placeholder="Search packages…" value="${esc(catalogState.q)}"><select id="reader-origin" aria-label="Package origin">${['All origins','Adopted from crates.io','Incan native'].map(o=>`<option ${catalogState.origin===o?'selected':''}>${o}</option>`).join('')}</select><select id="reader-category" aria-label="Package category">${['All categories',...new Set(packages.map(p=>p.category))].map(o=>`<option ${catalogState.category===o?'selected':''}>${esc(o)}</option>`).join('')}</select><label class="license-filter">License<select id="reader-license" aria-label="Package license">${['All licenses',...new Set(packages.flatMap(p=>(p.about.license||'').split(/\s+(?:OR|AND|WITH)\s+|[()]/).map(x=>x.trim()).filter(Boolean)))].map(o=>`<option ${catalogState.license===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><button class="reset-filters" id="reset-filters">Reset filters</button></div><p class="filter-hint">License matches include alternatives, such as MIT OR Apache-2.0.</p><div class="reader-columns"><span>Package</span><span>Version</span></div><div id="reader-rows"></div><div id="reader-count" class="reader-count" role="status"></div><div id="reader-pagination" class="reader-pagination"></div></section><section class="reader-preview" aria-label="Selected package preview" id="reader-preview"></section></div>${footer()}`;document.getElementById('reader-preview').append(content);document.getElementById('catalog-toggle').addEventListener('click',()=>{catalogCollapsed=!catalogCollapsed;applyCollapse()});applyCollapse();listRows(selected.name);document.getElementById('reader-search').addEventListener('input',e=>{catalogState.q=e.target.value;catalogState.page=0;listRows(selected.name)});document.getElementById('reader-origin').addEventListener('change',e=>{catalogState.origin=e.target.value;catalogState.page=0;listRows(selected.name)});document.getElementById('reader-category').addEventListener('change',e=>{catalogState.category=e.target.value;catalogState.page=0;listRows(selected.name)});document.getElementById('reader-license').addEventListener('change',e=>{catalogState.license=e.target.value;catalogState.page=0;listRows(selected.name)});document.getElementById('reset-filters').addEventListener('click',()=>{catalogState={q:'',origin:'All origins',category:'All categories',license:'All licenses',page:0};renderReader(selected)});document.title='Catalog · incan.pub — design preview'}
function applyCollapse(){const panel=document.getElementById('catalog-panel'),shell=document.querySelector('.reader-shell'),button=document.getElementById('catalog-toggle');panel.hidden=catalogCollapsed;shell.classList.toggle('catalog-collapsed',catalogCollapsed);button.setAttribute('aria-expanded',String(!catalogCollapsed));button.setAttribute('aria-label',catalogCollapsed?'Show catalog':'Hide catalog');button.title=catalogCollapsed?'Show catalog':'Hide catalog';button.classList.toggle('is-collapsed',catalogCollapsed)}
function route(){const name=location.hash.startsWith('#package/')?location.hash.slice(9):null;const p=packages.find(p=>p.name===name);if(innerWidth<=900)catalogCollapsed=Boolean(p);renderReader(p);window.scrollTo(0,0)}

function oldRoute(){const name=location.hash.startsWith('#package/')?location.hash.slice(9):null;const p=packages.find(p=>p.name===name);p?packagePage(p):browse();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
const search=document.getElementById('search'),results=document.getElementById('results');search.addEventListener('input',()=>{let q=search.value.trim().toLowerCase();results.hidden=!q;results.innerHTML=q?(packages.filter(p=>[p.name,p.about.description].join(' ').toLowerCase().includes(q)).slice(0,8).map(p=>`<a href="#package/${p.name}">${esc(p.name)} · ${esc(p.version)}</a>`).join('')||'No matching packages in this preview.'):''});results.addEventListener('click',()=>{results.hidden=true;search.value=''});search.addEventListener('keydown',e=>{if(e.key==='Escape')results.hidden=true;if(e.key==='Enter'){const a=results.querySelector('a');if(a)a.click()}});document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();search.focus()}});
</script></body></html>
