<header class="site-header"><div class="header-inner">

  <nav aria-label="Main navigation">
    <details class="header-search"><summary aria-label="Search packages"><img src="{{root}}assets/site/icons/magnifying-glass.svg" alt="" aria-hidden="true"><span>Search</span></summary>

    </details>
    <a href="{{root}}catalog/"{{current}}>Catalog</a>
    <a href="https://github.com/encero-systems/incan.pub/tree/main/docs">Docs</a>
    <a href="https://github.com/encero-systems/incan.pub">GitHub</a>
  </nav>
</div></header>
